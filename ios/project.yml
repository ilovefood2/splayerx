name: SPlayer
options:
  bundleIdPrefix: org.splayer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "4.11.130"
    CURRENT_PROJECT_VERSION: "130"
targets:
  SPlayer:
    type: application
    platform: iOS
    sources: [SPlayer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.splayer.ios
        INFOPLIST_FILE: SPlayer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  SPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SPlayerTests]
    dependencies:
      - target: SPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SPlayerUITests]
    dependencies:
      - target: SPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SPlayer:
    build:
      targets:
        SPlayer: all
    test:
      targets: [SPlayerTests, SPlayerUITests]
