name: XPlayer
options:
  bundleIdPrefix: com.ilovefood2
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "4.11.134"
    CURRENT_PROJECT_VERSION: "134"
targets:
  XPlayer:
    type: application
    platform: iOS
    sources: [XPlayer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilovefood2.xplayer
        INFOPLIST_FILE: XPlayer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  XPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [XPlayerTests]
    dependencies:
      - target: XPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  XPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [XPlayerUITests]
    dependencies:
      - target: XPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  XPlayer:
    build:
      targets:
        XPlayer: all
    test:
      targets: [XPlayerTests, XPlayerUITests]
